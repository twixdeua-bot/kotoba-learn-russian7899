name: Build Kotoba APK

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: bash
        run: |
          set -eu
          ARCHIVE="kotoba-learn-russian-final-v4.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Archive not found: $ARCHIVE"
            exit 1
          fi
          mkdir -p project
          unzip -q "$ARCHIVE" -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -eu
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -eu
          cd "$PROJECT_DIR"
          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

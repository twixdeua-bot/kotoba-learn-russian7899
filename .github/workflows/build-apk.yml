name: Build Kotoba APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=""

          for FILE in \
            kotoba-learn-russian-fixed-v2.zip \
            kotoba-learn-russian-fixed.zip \
            kotoba-learn-russian-full.zip
          do
            if [ -f "$FILE" ]; then
              ARCHIVE="$FILE"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            echo "::error::ZIP archive not found in repository root."
            echo "Upload the Kotoba project ZIP to the repository."
            exit 1
          fi

          echo "Using archive: $ARCHIVE"

          mkdir -p project
          unzip -q "$ARCHIVE" -d project

          echo "Archive extracted successfully."
          echo "Searching for Gradle wrapper..."

          find project -type f -name gradlew -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$(find project -type f -name gradlew | head -n 1)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle wrapper gradlew was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file was not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

      - name: Find generated APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
